[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lb-sim"
version = "0.1.0"
description = "Stochastic load balancer policy simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.0",
  "matplotlib>=3.8.0",
]

[project.scripts]
lb-sim = "lb_sim.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
